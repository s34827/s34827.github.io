<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แฟ้มสะสมผลงาน | แนวเภสัชศาสตร์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#102824;--teal:#184e47;--teal-2:#24665d;--gold:#c4a35a;--gold-soft:#e8d7a8;--cream:#f4efe4;--paper:#fffcf6;--muted:#5d6d68;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{font-family:"Sarabun",sans-serif;color:var(--ink);background:radial-gradient(900px 420px at 10% -10%, rgba(196,163,90,.18), transparent 55%),radial-gradient(700px 380px at 110% 8%, rgba(24,78,71,.12), transparent 50%),linear-gradient(180deg,#efe8d6 0%, var(--cream) 28%, #e7efe8 100%);min-height:100vh;}
    .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:36px 22px 70px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px;}
    .brand{display:flex;align-items:center;gap:12px;letter-spacing:.12em;font-size:12px;text-transform:uppercase;color:var(--teal);font-weight:600;}
    .year-pill{border:1px solid var(--gold);color:var(--teal);padding:6px 14px;border-radius:999px;font-size:13px;background:rgba(255,252,246,.7);}
    header.hero{text-align:center;background:linear-gradient(180deg, rgba(255,252,246,.92), rgba(255,252,246,.78));border:1px solid rgba(196,163,90,.45);box-shadow:0 18px 50px rgba(16,40,36,.08);border-radius:28px;padding:42px 24px 36px;position:relative;overflow:hidden;}
    .avatar-wrap{width:168px;height:168px;margin:0 auto 18px;position:relative;}
    .avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--gold), 0 16px 30px rgba(16,40,36,.18);}
    .avatar-ring{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(196,163,90,.7);animation:spin 28s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .kicker{color:var(--gold);letter-spacing:.28em;font-size:12px;text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,5vw,52px);font-weight:600;color:var(--teal);}
    .subtitle{margin:10px auto 0;max-width:560px;color:var(--muted);font-size:17px;font-weight:300;}
    .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;}
    .chip{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(24,78,71,.08);color:var(--teal);}
    .section-title{margin:46px 0 18px;display:flex;align-items:center;gap:14px;}
    .section-title h2{font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--teal);font-weight:600;white-space:nowrap;}
    .section-title span{height:1px;flex:1;background:linear-gradient(90deg, var(--gold), transparent);}
    .hint{color:var(--muted);font-size:14px;margin:-4px 0 16px;}
    .grid{display:grid;gap:20px;}
    @media(min-width:760px){.grid.three{grid-template-columns:repeat(3,1fr);}.grid.feature{grid-template-columns:1.15fr .85fr;}}
    .card{background:var(--paper);border:1px solid rgba(196,163,90,.35);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(16,40,36,.06);}
    .card:hover{transform:translateY(-6px);}
    .card img.cover{width:100%;height:190px;object-fit:cover;display:block;}
    .card .body{padding:20px;}
    .num{font-family:"Cormorant Garamond",serif;color:var(--gold);font-size:13px;letter-spacing:.18em;text-transform:uppercase;}
    .card h3{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--teal);margin:4px 0 10px;}
    .card p{color:#3f4f4b;line-height:1.85;font-size:15px;}
    .about{background:linear-gradient(135deg, var(--teal), #0e332e);color:#f6f1e7;border:none;padding:28px 26px;}
    .about h3{color:var(--gold-soft);font-family:"Cormorant Garamond",serif;font-size:26px;margin-bottom:8px;}
    .quote{margin-top:14px;padding-top:12px;border-top:1px solid rgba(232,215,168,.3);font-style:italic;font-family:"Cormorant Garamond",serif;font-size:20px;}
    .skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
    .skill{border:1px solid rgba(196,163,90,.45);color:var(--teal);background:#fff;padding:7px 12px;border-radius:999px;font-size:13px;}
    .work-btn{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer;}
    .open-hint{margin-top:12px;color:var(--teal);font-size:13px;font-weight:600;}
    .actions{text-align:center;margin-top:36px;}
    .btn{display:inline-flex;text-decoration:none;color:#fff;background:linear-gradient(90deg, var(--teal), var(--teal-2));padding:13px 26px;border-radius:999px;font-weight:600;}
    footer{text-align:center;margin-top:48px;color:var(--muted);font-size:14px;}
    .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;}
    .modal.open{display:flex;}
    .modal-bg{position:absolute;inset:0;background:rgba(12,24,22,.62);}
    .modal-box{position:relative;width:min(880px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px;}
    .modal-head{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(196,163,90,.25);}
    .close{width:38px;height:38px;border-radius:50%;border:1px solid #c4a35a;background:#fff;cursor:pointer;}
    .modal-body{padding:18px 20px 26px;}
    .slot{margin:0 0 20px;}
    .slot h4{color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
    .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
    .photos img{width:100%;height:170px;object-fit:cover;border-radius:14px;background:#efe8d6;}
    .work-item{background:#fff;border:1px solid rgba(24,78,71,.12);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
    pre.code-slot{margin:0;padding:14px;border-radius:14px;background:#102824;color:#e8d7a8;font-family:"JetBrains Mono",monospace;font-size:13px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Apothecary Portfolio</div>
      <div class="year-pill">นำเสนอ· 2026</div>
    </div>
    <header class="hero">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <img src="foredu.jpg" alt="รูปโปรไฟล์">
      </div>
      <p class="kicker">Student Portfolio</p>
      <h1>แฟ้มสะสมผลงาน</h1>
      <p class="subtitle">รวบรวมผลงาน กิจกรรม และทักษะที่สะท้อนความสนใจด้านเภสัชศาสตร์ วิทยาศาสตร์ และการใช้เทคโนโลยีเพื่อการเรียนรู้</p>
    </header>

    <div class="section-title"><h2>ผลงานเด่น</h2><span></span></div>
    <p class="hint">คลิกการ์ดเพื่อดูรายละเอียดของแต่ละหัวข้อ</p>
    <div class="grid three">
      <article class="card"><button class="work-btn" data-open="w1" type="button">
        <img class="cover" src="images/foredu.jpg" alt="โครงงานวิทยาศาสตร์">
        <div class="body"><p class="num">01 · Inquiry</p><h3>โครงงานวิทยาศาสตร์และการคำนวณ</h3><p>ศึกษาการแก้ปัญหาด้วยวิทยาศาสตร์และการเขียนโปรแกรม</p><div class="open-hint">คลิกเพื่อดูผลงาน →</div></div>
      </button></article>
      <article class="card"><button class="work-btn" data-open="w2" type="button">
        <img class="cover" src="images/project2.jpg" alt="กิจกรรมและเกียรติบัตร">
        <div class="body"><p class="num">02 · Practice</p><h3>กิจกรรมและเกียรติบัตร</h3><p>เข้าร่วมการแข่งขัน กิจกรรมวิชาการ และค่ายวิทยาศาสตร์</p><div class="open-hint">คลิกเพื่อดูผลงาน →</div></div>
      </button></article>
      <article class="card"><button class="work-btn" data-open="w3" type="button">
        <img class="cover" src="images/project3.jpg" alt="ทักษะที่สนใจ">
        <div class="body"><p class="num">03 · Skill</p><h3>ทักษะที่สนใจ</h3><p>ผสานวิทยาศาสตร์สุขภาพกับทักษะดิจิทัล</p><div class="open-hint">คลิกเพื่อดูผลงาน →</div></div>
      </button></article>
    </div>
    <div class="actions"><a class="btn" href="index.html">⬅ กลับหน้าแรก</a></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-bg" data-close></div>
    <div class="modal-box">
      <div class="modal-head"><div><p class="num" id="mNum"></p><h3 id="mTitle"></h3></div><button class="close" data-close type="button">×</button></div>
      <div class="modal-body" id="mBody"></div>
    </div>
  </div>
<script>
const works={
  w1:{num:"01 · Inquiry",title:"โครงงานวิทยาศาสตร์และการคำนวณ",html:`
    <div class="slot"><h4>ในหัวข้อนี้มีอะไรบ้าง</h4>
      <div class="work-item"><b>โครงงานวิทยาศาสตร์</b>ใส่ชื่อโครงงานตรงนี้</div>
      <div class="work-item"><b>งานคำนวณ / โปรแกรม</b>ใส่ชื่อชิ้นงานตรงนี้</div></div>
    <div class="slot"><h4>รูปผลงาน</h4><div class="photos">
      <img src="images/sci-1.jpg" alt="รูปผลงาน 1">
      <img src="images/sci-2.jpg" alt="รูปผลงาน 2">
      <img src="images/sci-3.jpg" alt="รูปผลงาน 3"></div></div>
    <div class="slot"><h4>ช่องใส่โค้ด</h4><pre class="code-slot"># วางโค้ดตรงนี้</pre></div>`},
  w2:{num:"02 · Practice",title:"กิจกรรมและเกียรติบัตร",html:`
    <div class="slot"><h4>ในหัวข้อนี้มีอะไรบ้าง</h4>
      <div class="work-item"><b>กิจกรรมวิชาการ</b>ใส่ชื่อกิจกรรมตรงนี้</div>
      <div class="work-item"><b>เกียรติบัตร</b>ใส่ชื่อเกียรติบัตรตรงนี้</div></div>
    <div class="slot"><h4>รูปกิจกรรมและเกียรติบัตร</h4><div class="photos">
      <img src="images/cert-1.jpg" alt="เกียรติบัตร 1">
      <img src="images/cert-2.jpg" alt="เกียรติบัตร 2">
      <img src="images/activity-1.jpg" alt="รูปกิจกรรม"></div></div>`},
  w3:{num:"03 · Skill",title:"ทักษะที่สนใจ",html:`
    <div class="slot"><h4>ในหัวข้อนี้มีอะไรบ้าง</h4>
      <div class="work-item"><b>วิทยาศาสตร์สุขภาพ</b>ใส่ชิ้นงานตรงนี้</div>
      <div class="work-item"><b>ทักษะดิจิทัล</b>HTML CSS JS Python</div></div>
    <div class="slot"><h4>รูปชิ้นงาน</h4><div class="photos">
      <img src="images/skill-1.jpg" alt="ชิ้นงาน 1">
      <img src="images/skill-2.jpg" alt="ชิ้นงาน 2"></div></div>
    <div class="slot"><h4>ช่องใส่โค้ด</h4><pre class="code-slot">// วางโค้ดตรงนี้</pre></div>`}
};
const modal=document.getElementById("modal");
document.querySelectorAll("[data-open]").forEach(btn=>{
  btn.onclick=()=>{const d=works[btn.dataset.open];mNum.textContent=d.num;mTitle.textContent=d.title;mBody.innerHTML=d.html;modal.classList.add("open");};
});
document.querySelectorAll("[data-close]").forEach(el=>el.onclick=()=>modal.classList.remove("open"));
document.onkeydown=e=>{if(e.key==="Escape")modal.classList.remove("open");};
</script>
</body>
</html>
